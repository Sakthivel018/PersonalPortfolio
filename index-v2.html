  <style>
    /* Custom scrollbar styles */
    * {
      scrollbar-width: thin;
      scrollbar-color: #1a1a1a #0a0a0a;
    }

    *::-webkit-scrollbar {
      width: 15px;
      margin-top: 2rem;
    }

    *::-webkit-scrollbar-track {
      background: #0a0a0a;
      border-radius: 5px;
    }

    *::-webkit-scrollbar-thumb {
      background-color: #1a1a1a;
      border-radius: 14px;
      border: 3px solid #0a0a0a;
    }

    /* Custom animations */
    @keyframes pulse {
      0% {
        transform: scale(0.8);
        background-color: #ffdb70;
        box-shadow: 0 0 0 0 #ffdb70;
      }
      50% {
        transform: scale(1.2);
        background-color: #ffc107;
        box-shadow: 0 0 0 10px #ffc107;
      }
      100% {
        transform: scale(0.8);
        background-color: #d4af37;
        box-shadow: 0 0 0 0 #d4af37;
      }
    }

    .dot {
      animation: pulse 1.5s infinite ease-in-out;
    }

    .dot:nth-child(1) { animation-delay: -0.3s; }
    .dot:nth-child(2) { animation-delay: -0.1s; }
    .dot:nth-child(3) { animation-delay: 0.1s; }

    /* Timeline styles */
    .timeline-item:not(:last-child)::before {
      content: "";
      position: absolute;
      top: -25px;
      left: -30px;
      width: 1px;
      height: calc(100% + 50px);
      background: #383838;
    }

    .timeline-item::after {
      content: "";
      position: absolute;
      top: 5px;
      left: -33px;
      height: 6px;
      width: 6px;
      background: linear-gradient(to right, #ffdb70, #ffc107);
      border-radius: 50%;
      box-shadow: 0 0 0 4px #383838;
    }
  </style>

      -->
      <article class="renderer hidden bg-secondary border border-jet rounded-2xl p-4 shadow-custom-1 z-10 lg:p-8 lg:h-full lg:overflow-y-auto" id="pageRender">
        <button class="go_back text-accent bg-gradient-to-br from-secondary to-primary p-2.5 shadow-custom-2 transition-all duration-250 z-10 rounded-tl-4xl text-xs">
          <span>Go Back</span>
        </button>
        <div id="render-content" class="flex w-4/5 w-full h-full"></div>
      </article>

    </div>

  </main>

  <!--
    - custom js link
  -->
  <script>
    'use strict';

    // element toggle function
    const elementToggleFunc = function (elem) { 
      elem.classList.toggle("active"); 
    }

    // sidebar variables
    const sidebar = document.querySelector("[data-sidebar]");
    const sidebarBtn = document.querySelector("[data-sidebar-btn]");

    // sidebar toggle functionality for mobile
    sidebarBtn.addEventListener("click", function () { 
      elementToggleFunc(sidebar); 
    });

    // testimonials variables
    const testimonialsItem = document.querySelectorAll("[data-testimonials-item]");
    const modalContainer = document.querySelector("[data-modal-container]");
    const modalCloseBtn = document.querySelector("[data-modal-close-btn]");
    const overlay = document.querySelector("[data-overlay]");

    // modal variable
    const modalImg = document.querySelector("[data-modal-img]");
    const modalTitle = document.querySelector("[data-modal-title]");
    const modalText = document.querySelector("[data-modal-text]");

    // modal toggle function
    const testimonialsModalFunc = function () {
      modalContainer.classList.toggle("active");
      overlay.classList.toggle("active");
    }

    // add click event to all modal items
    for (let i = 0; i < testimonialsItem.length; i++) {
      testimonialsItem[i].addEventListener("click", function () {
        modalImg.src = this.querySelector("[data-testimonials-avatar]").src;
        modalImg.alt = this.querySelector("[data-testimonials-avatar]").alt;
        modalTitle.innerHTML = this.querySelector("[data-testimonials-title]").innerHTML;
        modalText.innerHTML = this.querySelector("[data-testimonials-text]").innerHTML;
        testimonialsModalFunc();
      });
    }

    // add click event to modal close button
    modalCloseBtn.addEventListener("click", testimonialsModalFunc);
    overlay.addEventListener("click", testimonialsModalFunc);

    // custom select variables
    const select = document.querySelector("[data-select]");
    const selectItems = document.querySelectorAll("[data-select-item]");
    const selectValue = document.querySelector("[data-select-value]");
    const filterBtn = document.querySelectorAll("[data-filter-btn]");

    select.addEventListener("click", function () { 
      elementToggleFunc(this); 
    });

    // add event in all select items
    for (let i = 0; i < selectItems.length; i++) {
      selectItems[i].addEventListener("click", function () {
        let selectedValue = this.innerText.toLowerCase();
        selectValue.innerText = this.innerText;
        elementToggleFunc(select);
        filterFunc(selectedValue);
      });
    }

    // filter variables
    const filterItems = document.querySelectorAll("[data-filter-item]");

    const filterFunc = function (selectedValue) {
      for (let i = 0; i < filterItems.length; i++) {
        if (selectedValue === "all") {
          filterItems[i].classList.add("active");
        } else if (selectedValue === filterItems[i].dataset.category) {
          filterItems[i].classList.add("active");
        } else {
          filterItems[i].classList.remove("active");
        }
      }
    }

    // add event in all filter button items for large screen
    let lastClickedBtn = filterBtn[0];

    for (let i = 0; i < filterBtn.length; i++) {
      filterBtn[i].addEventListener("click", function () {
        let selectedValue = this.innerText.toLowerCase();
        selectValue.innerText = this.innerText;
        filterFunc(selectedValue);
        
        lastClickedBtn.classList.remove("active");
        this.classList.add("active");
        lastClickedBtn = this;
      });
    }

    // contact form variables
    const form = document.querySelector("[data-form]");
    const formInputs = document.querySelectorAll("[data-form-input]");
    const formBtn = document.querySelector("[data-form-btn]");

    // add event to all form input field
    for (let i = 0; i < formInputs.length; i++) {
      formInputs[i].addEventListener("input", function () {
        // check form validation
        if (form.checkValidity()) {
          formBtn.removeAttribute("disabled");
        } else {
          formBtn.setAttribute("disabled", "");
        }
      });
    }

    // page navigation variables
    const navigationLinks = document.querySelectorAll("[data-nav-link]");
    const pages = document.querySelectorAll("[data-page]");

    // add event to all nav link
    for (let i = 0; i < navigationLinks.length; i++) {
      navigationLinks[i].addEventListener("click", function () {
        document.querySelector(`.renderer`).classList.remove("active");
        
        for (let i = 0; i < pages.length; i++) {
          if (this.innerHTML.toLowerCase() === pages[i].dataset.page) {
            pages[i].classList.remove("hidden");
            pages[i].classList.add("block");
            navigationLinks[i].classList.add("text-accent");
            window.scrollTo(0, 0);
          } else {
            pages[i].classList.remove("block");
            pages[i].classList.add("hidden");
            navigationLinks[i].classList.remove("text-accent");
          }
        }
      });
    }

    // API and data loading script
    const apiURL = "https://script.google.com/macros/s/AKfycbwnnth6HVa_OX_QjMEl6cAHD41pV60MPfCJCZlIVzZDzhbijNXmCSsdV2psMOEyN61K/exec";

    // Fetch social links
    fetch(`${apiURL}?q=SocialList`)
      .then((response) => response.json())
      .then((data) => {
        let _social = "";
        data.forEach(element => {
          const href = element.href;
          const target = element.target;
          const a_class = element.class;
          const iconname = element.icon_name;
          li = `<li class="social-item">
                <a href="${href}" target="${target}" class="social-link text-text-light text-lg hover:text-text ${a_class}">
                  <ion-icon name="${iconname}"></ion-icon>
                </a>
              </li>`;
          _social = _social + li;
        });
        document.getElementById("social_list").innerHTML = _social;
      });

    // Fetch profile information
    fetch(`${apiURL}?q=Profile`)
      .then((response) => response.json())
      .then((apiData) => {
        document.getElementById("name").innerHTML = apiData.name;
        document.getElementById("designation").innerHTML = apiData.designation;
        document.getElementById("email").innerHTML = apiData.email;
        document.getElementById("ph_no").innerHTML = apiData.ph_no;
        document.getElementById("birthday").innerHTML = apiData.birthday;
        document.getElementById("location").innerHTML = apiData.location;
        
        let about_me = "";
        apiData.about_me.forEach((p) => {
          let p_tag = `<p class="mb-4">${p}</p>`;
          about_me = about_me + p_tag;
        });
        document.getElementById("about_me").innerHTML = about_me;
        
        let services = "";
        apiData.what_im_doing.forEach((service) => {
          const src = service.src;
          const alt = service.alt;
          const title = service.title;
          const text = service.text;
          let service_tag = `<li class="service-item relative bg-gradient-to-br from-secondary to-primary p-5 rounded-xl shadow-custom-2 z-10 before:content-[''] before:absolute before:inset-px before:bg-gradient-to-br before:from-primary before:to-secondary before:rounded-inherit before:-z-10 lg:flex lg:items-start lg:gap-5 lg:p-8">
                <div class="service-icon-box mb-2.5 lg:mb-0 lg:mt-1">
                  <img src="${src}" alt="${alt}" width="40" class="mx-auto">
                </div>
                <div class="service-content-box text-center lg:text-left">
                  <h4 class="h4 service-item-title text-base font-medium text-white capitalize mb-2">${title}</h4>
                  <p class="service-item-text text-sm text-text font-light leading-relaxed">
                    ${text}
                  </p>
                </div>
              </li>`;
          services = services + service_tag;
        });
        document.getElementById("service_list").innerHTML = services;
      });

    // Fetch testimonials
    fetch(`${apiURL}?q=Testimonials`)
      .then((response) => response.json())
      .then((data) => {
        let testimonials = "";
        data.forEach((service) => {
          const src = service.src;
          const alt = service.alt;
          const title = service.title;
          const text = service.text;
          let li_tag = `<li class="testimonials-item min-w-full snap-center">
              <div class="content-card relative bg-gradient-to-br from-secondary to-primary p-4 pt-12 rounded-xl shadow-custom-2 cursor-pointer z-10 before:content-[''] before:absolute before:inset-px before:bg-gradient-to-br before:from-primary before:to-secondary before:rounded-inherit before:-z-10 lg:p-8 lg:pt-16" data-testimonials-item>
                <figure class="testimonials-avatar-box absolute top-0 left-0 translate-x-4 -translate-y-6 bg-gradient-to-br from-primary to-secondary rounded-xl shadow-custom-1 lg:translate-x-8 lg:-translate-y-8 lg:rounded-2xl">
                  <img src="${src}" alt="${alt}" width="60" data-testimonials-avatar class="lg:w-20">
                </figure>
                <h4 class="h4 testimonials-item-title text-base font-medium text-white capitalize mb-2 lg:ml-24" data-testimonials-title>${title}</h4>
                <div class="testimonials-text text-sm text-text font-light leading-relaxed line-clamp-4 overflow-hidden lg:line-clamp-2" data-testimonials-text>
                  <p>
                    ${text}
                  </p>
                </div>
              </div>
            </li>`;
          testimonials = testimonials + li_tag;
        });
        document.getElementById("testimonials").innerHTML = testimonials;
      });

    // Fetch education
    fetch(`${apiURL}?q=Education`)
      .then((response) => response.json())
      .then((data) => {
        let education = "";
        data.forEach((edu) => {
          const place = edu.place;
          const span = edu.span;
          const description = edu.description;
          let li_tag = `<li class="timeline-item relative mb-5 lg:mb-6">
            <h4 class="h4 timeline-item-title text-sm font-medium leading-relaxed mb-2 lg:text-base">${place}</h4>
            <span class="text-accent font-normal leading-relaxed">${span}</span>
            <p class="timeline-text text-text font-light leading-relaxed">
              ${description}
            </p>
          </li>`;
          education = education + li_tag;
        });
        document.getElementById("education").innerHTML = education;
      });

    // Fetch experience
    fetch(`${apiURL}?q=Experience`)
      .then((response) => response.json())
      .then((data) => {
        let experience = "";
        data.forEach((exp) => {
          const title = exp.title;
          const span = exp.span;
          const description = exp.description;
          let li_tag = `<li class="timeline-item relative mb-5 lg:mb-6">
            <h4 class="h4 timeline-item-title text-sm font-medium leading-relaxed mb-2 lg:text-base">${title}</h4>
            <span class="text-accent font-normal leading-relaxed">${span}</span>
            <p class="timeline-text text-text font-light leading-relaxed">
              ${description}
            </p>
          </li>`;
          experience = experience + li_tag;
        });
        document.getElementById("experience").innerHTML = experience;
      });

    // Fetch skills
    fetch(`${apiURL}?q=Skills`)
      .then((response) => response.json())
      .then((data) => {
        let skills = "";
        data.forEach((skill) => {
          const name = skill.name;
          const score = skill.score;
          let li_tag = `<li class="skills-item mb-4 lg:mb-6">
            <div class="title-wrapper flex items-center gap-1 mb-2">
              <h5 class="h5 text-sm font-medium text-white">${name}</h5>
              <data value="${score}" class="text-text text-xs font-light">${score}</data>
            </div>
            <div class="skill-progress-bg bg-jet w-full h-2 rounded-xl">
              <div class="skill-progress-fill bg-gradient-to-r from-accent to-accent-light h-full rounded-xl" style="width: ${score};"></div>
            </div>
          </li>`;
          skills = skills + li_tag;
        });
        document.getElementById("skills").innerHTML = skills;
      });

    // Fetch certifications
    fetch(`${apiURL}?q=Certifications`)
      .then((response) => response.json())
      .then((data) => {
        let certifications = "";
        data.forEach((exp) => {
          const title = exp.title;
          const span = exp.span;
          let li_tag = `<li class="timeline-item relative mb-5 lg:mb-6">
            <h4 class="h4 timeline-item-title text-sm font-medium leading-relaxed mb-2 lg:text-base">${title}</h4>
            <span class="text-accent font-normal leading-relaxed">${span}</span>
          </li>`;
          certifications = certifications + li_tag;
        });
        document.getElementById("certifications").innerHTML = certifications;
      });

    // Fetch blogs
    fetch(`${apiURL}?q=Blogs`)
      .then((response) => response.json())
      .then((data) => {
        let blogs = "";
        data.forEach((blog) => {
          const href = blog.href;
          const img_src = blog.img_src;
          const img_alt = blog.img_alt;
          const header = blog.header;
          const date_time = blog.date_time;
          const date_time_value = blog.date_time_value;
          const sub_title = blog.sub_title;
          const description = blog.description;
          let li_tag = `<li class="blog-post-item">
            <a onclick="showDetails('blog','${href}');" class="relative bg-gradient-to-br from-secondary to-primary h-full shadow-custom-4 rounded-xl z-10 before:content-[''] before:absolute before:inset-px before:bg-primary before:rounded-inherit before:-z-10 block">
              <figure class="blog-banner-box w-full h-48 rounded-xl overflow-hidden mb-4 lg:h-56">
                <img src="${img_src}" alt="${img_alt}" loading="lazy" class="w-full h-full object-cover transition-transform duration-300 hover:scale-110">
              </figure>
              <div class="blog-content p-4 lg:p-6">
                <div class="blog-meta flex justify-start items-center gap-2 mb-2.5">
                  <p class="blog-category text-text-light text-xs font-light">${header}</p>
                  <span class="dot bg-text-light w-1 h-1 rounded-full"></span>
                  <time datetime="${date_time_value}" class="text-text-light text-xs font-light">${date_time}</time>
                </div>
                <h3 class="h3 blog-item-title text-base font-medium leading-relaxed mb-2.5 transition-colors duration-300 hover:text-accent">${sub_title}</h3>
                <p class="blog-text text-text font-light leading-relaxed text-sm">
                  ${description}
                </p>
              </div>
            </a>
          </li>`;
          blogs = blogs + li_tag;
        });
        document.getElementById("blogs").innerHTML = blogs;
      });

    // Fetch projects
    fetch(`${apiURL}?q=Projects`)
      .then((response) => response.json())
      .then((data) => {
        let projects = "";
        let allCategories = new Set();
        allCategories.add("All");
        
        data.forEach((eachProject) => {
          if (!eachProject.visible) {
            return null;
          }
          
          const href = eachProject.href;
          const img_src = eachProject.img_src;
          const img_alt = eachProject.img_alt;
          const header = eachProject.header;
          const sub_title = eachProject.sub_title;
          const description = eachProject.description;
          const category = eachProject.category;
          allCategories.add(category);
          
          let li_tag = `<li class="project-item block animate-scale-up" data-filter-item data-category="${category}">
          <a onclick="showDetails('projects','${href}');" class="w-full block">
            <figure class="project-img relative w-full h-48 rounded-xl overflow-hidden mb-4 lg:h-52 group">
              <div class="absolute inset-0 bg-transparent z-10 transition-all duration-300 group-hover:bg-black/50"></div>
              <div class="project-item-icon-box absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-jet text-accent text-xl p-5 rounded-xl opacity-0 z-10 transition-all duration-300 scale-80 group-hover:opacity-100 group-hover:scale-100">
                <ion-icon name="link-outline"></ion-icon>
              </div>
              <img src="${img_src}" alt="${img_alt}" loading="lazy" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-110">
            </figure>
            <h3 class="project-title text-base font-medium text-white capitalize leading-relaxed ml-2.5">${header}</h3>
            <p class="project-category text-text-light text-xs font-light ml-2.5">${category}</p>
          </a>
        </li>`;
          projects = projects + li_tag;
        });
        
        allCategories = Array.from(allCategories);
        let filter_text = "";
        let select_text = "";
        
        allCategories.forEach((each_category) => {
          filter_text += `<li class="filter-item">
            <button class="${each_category === 'All' ? 'text-accent' : 'text-text'} text-sm font-normal transition-colors duration-300 hover:text-text-light" data-filter-btn>${each_category}</button>
          </li>`;
          
          select_text += `<li class="select-item">
            <button class="bg-secondary text-text text-sm font-light w-full p-2 rounded-lg hover:bg-onyx" data-select-item>${each_category}</button>
          </li>`;
        });
        
        document.getElementById("project_list").innerHTML = projects;
        document.getElementById("project_filter_list").innerHTML = filter_text;
        document.getElementById("project_select_list").innerHTML = select_text;
        document.getElementById("loader").style.display = "none";
      });

    // Show details function
    const showDetails = (type, href) => {
      document.getElementById("loader").style.display = "flex";
      document.querySelector(".go_back").removeEventListener('click', () => {
        document.querySelector(`.renderer`).classList.remove("active");
        document.querySelector(`.${type}`).classList.add("active");
      });
      
      hideArticles('renderer');
      
      fetch(`${apiURL}?q=${href}&p=${type}`)
        .then((response) => response.json())
        .then((data) => {
          const iframe = document.querySelector('#render-content');
          iframe.innerHTML = data.content;
          document.getElementById("loader").style.display = "none";
        });
        
      document.querySelector(".go_back").addEventListener('click', () => {
        document.querySelector(`.renderer`).classList.add("hidden");
        document.querySelector(`.${type}`).classList.remove("hidden");
        document.querySelector(`.${type}`).classList.add("block");
      });
    };

    // Hide articles function
    const hideArticles = className => {
      const pages = document.querySelectorAll("[data-page], .renderer");
      pages.forEach(articlePage => {
        articlePage.classList.remove("block");
        articlePage.classList.add("hidden");
      });
      window.scrollTo(0, 0);
      document.querySelector(`.${className}`).classList.remove("hidden");
      document.querySelector(`.${className}`).classList.add("block");
    };

    // Initialize active states with Tailwind classes
    document.addEventListener('DOMContentLoaded', function() {
      // Set initial active nav link
      document.querySelector('[data-nav-link][load-page="about"]').classList.add('text-accent');
      
      // Set initial active page
      document.querySelector('[data-page="about"]').classList.remove('hidden');
      document.querySelector('[data-page="about"]').classList.add('block');

      // Sidebar active state management
      const sidebar = document.querySelector('[data-sidebar]');
      const sidebarBtn = document.querySelector('[data-sidebar-btn]');
      
      if (sidebarBtn) {
        sidebarBtn.addEventListener('click', function() {
          if (sidebar.classList.contains('max-h-28')) {
            sidebar.classList.remove('max-h-28');
            sidebar.classList.add('max-h-[405px]');
          } else {
            sidebar.classList.add('max-h-28');
            sidebar.classList.remove('max-h-[405px]');
          }
        });
      }

      // Modal functionality
      const modalContainer = document.querySelector('[data-modal-container]');
      const overlay = document.querySelector('[data-overlay]');
      const modal = modalContainer?.querySelector('.testimonials-modal');
      
      function toggleModal() {
        if (modalContainer && overlay && modal) {
          modalContainer.classList.toggle('pointer-events-auto');
          modalContainer.classList.toggle('visible');
          overlay.classList.toggle('opacity-80');
          overlay.classList.toggle('visible');
          overlay.classList.toggle('pointer-events-auto');
          modal.classList.toggle('scale-100');
          modal.classList.toggle('opacity-100');
        }
      }

      // Project filter functionality
      const filterSelect = document.querySelector('[data-select]');
      const selectList = filterSelect?.nextElementSibling;
      
      if (filterSelect && selectList) {
        filterSelect.addEventListener('click', function() {
          const icon = this.querySelector('.select-icon ion-icon');
          if (selectList.classList.contains('opacity-0')) {
            selectList.classList.remove('opacity-0', 'invisible', 'pointer-events-none');
            selectList.classList.add('opacity-100', 'visible', 'pointer-events-auto');
            if (icon) icon.style.transform = 'rotate(180deg)';
          } else {
            selectList.classList.add('opacity-0', 'invisible', 'pointer-events-none');
            selectList.classList.remove('opacity-100', 'visible', 'pointer-events-auto');
            if (icon) icon.style.transform = 'rotate(0deg)';
          }
        });
      }
    });
  </script>

  <!--
    - ionicon link

  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
