          boxShadow: {
            '1': '-4px 8px 24px rgba(0, 0, 0, 0.25)',

            '4': '0 25px 50px rgba(0, 0, 0, 0.15)',
            '5': '0 24px 80px rgba(0, 0, 0, 0.25)',
          },
          animation: {
            'fade': 'fade 0.5s ease backwards',
            'scale-up': 'scaleUp 0.25s ease forwards',
            'pulse': 'pulse 1.5s infinite ease-in-out',
          },
          keyframes: {
            fade: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            scaleUp: {
              '0%': { transform: 'scale(0.5)' },
              '100%': { transform: 'scale(1)' },
            },
            pulse: {
              '0%': {
                transform: 'scale(0.8)',
                backgroundColor: '#f9bf45',
                boxShadow: '0 0 0 0 #f9bf45',
              },
              '50%': {
                transform: 'scale(1.2)',

                boxShadow: '0 0 0 10px #f9bf45',
              },
              '100%': {
                transform: 'scale(0.8)',

        <section class="skill">
          <h3 class="h3 skills-title text-white-2 text-lg mb-5">My skills</h3>
          <ul class="skills-list content-card p-5 md:p-8" id="skills">
          </ul>
        </section>

        <header>
          <h2 class="h2 article-title text-white-2 text-xl capitalize relative pb-2 mb-8 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-8 after:h-0.5 after:bg-gradient-yellow after:rounded-[3px] md:text-2xl md:pb-4 md:mb-8 md:after:w-10 md:after:h-1">Projects</h2>
        </header>
        <section class="projects">
          <ul class="filter-list hidden justify-start items-center gap-6 pl-1 mb-8 md:flex" id="project_filter_list" style="display: none;">
          </ul>
          <div class="filter-select-box relative mb-6 md:hidden">
            <button class="filter-select bg-eerie-black-2 text-light-gray flex justify-between items-center w-full px-4 py-3 border border-jet rounded-[14px] text-sm font-light" data-select>
              <div class="select-value" data-select-value>Select category</div>
              <div class="select-icon">
                <ion-icon name="chevron-down"></ion-icon>
              </div>
            </button>
            <ul class="select-list absolute top-[calc(100%+6px)] w-full px-1.5 py-1.5 border border-jet rounded-[14px] bg-eerie-black-2 z-2 opacity-0 invisible pointer-events-none transition-all duration-150 ease-in-out" id="project_select_list">
            </ul>
          </div>
          <ul class="project-list grid grid-cols-1 gap-8 mb-2.5 md:grid-cols-2 lg:grid-cols-3" id="project_list">
          </ul>
        </section>

      <!--
        - #BLOG
      -->
      <article class="blog hidden bg-eerie-black-2 border border-jet rounded-[20px] p-4 shadow-1 animate-fade md:p-8 lg:p-8 lg:h-full lg:overflow-y-auto" data-page="blog">
        <header>
          <h2 class="h2 article-title text-white-2 text-xl capitalize relative pb-2 mb-8 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-8 after:h-0.5 after:bg-gradient-yellow after:rounded-[3px] md:text-2xl md:pb-4 md:mb-8 md:after:w-10 md:after:h-1">Blog</h2>

          </ul>
        </section>

      <!--
        - #CONTACT
      -->
      <article class="contact hidden bg-eerie-black-2 border border-jet rounded-[20px] p-4 shadow-1 animate-fade md:p-8 lg:p-8 lg:h-full" data-page="contact">
        <header>
          <h2 class="h2 article-title text-white-2 text-xl capitalize relative pb-2 mb-8 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-8 after:h-0.5 after:bg-gradient-yellow after:rounded-[3px] md:text-2xl md:pb-4 md:mb-8 md:after:w-10 md:after:h-1">Contact</h2>
        </header>
        <section class="contact-form">
          <h3 class="h3 form-title text-white-2 text-lg capitalize mb-5">Contact Form</h3>
          <form action="#" class="form" data-form>
            <div class="input-wrapper grid grid-cols-1 gap-6 mb-6 md:grid-cols-2 md:gap-8 md:mb-8">
              <input type="text" name="fullname" class="form-input text-white-2 text-sm font-medium px-5 py-3 border border-jet rounded-[14px] outline-none placeholder:font-medium focus:border-orange-yellow-crayola focus:invalid:border-bittersweet-shimmer md:text-base md:px-5 md:py-4" placeholder="Full name" required data-form-input>
              <input type="email" name="email" class="form-input text-white-2 text-sm font-medium px-5 py-3 border border-jet rounded-[14px] outline-none placeholder:font-medium focus:border-orange-yellow-crayola focus:invalid:border-bittersweet-shimmer md:text-base md:px-5 md:py-4" placeholder="Email address" required data-form-input>
            </div>
            <textarea name="message" class="form-input text-white-2 text-sm font-medium px-5 py-3 border border-jet rounded-[14px] outline-none placeholder:font-medium focus:border-orange-yellow-crayola focus:invalid:border-bittersweet-shimmer min-h-[100px] h-[120px] max-h-[200px] resize-vertical mb-6 md:text-base md:px-5 md:py-4 md:min-h-[120px] md:h-[120px] md:max-h-[200px] md:mb-8" placeholder="Your Message" required data-form-input></textarea>
            <button class="form-btn type:submit disabled:opacity-70 disabled:cursor-not-allowed disabled:hover:bg-gradient-onyx disabled:hover:before:bg-gradient-jet text-sm px-5 py-3 md:text-base md:px-5 md:py-4 md:w-max md:ml-auto" type="submit" disabled data-form-btn>
              <ion-icon name="paper-plane"></ion-icon>
              <span>Send Message</span>
            </button>
            <p id="form-success" style="display:none;color:#f9bf45;margin-top:10px;">Thanks! Your message has been sent.</p>
          </form>
        </section>
      </article>
      <article class="renderer hidden" id="pageRender">
        <button class="go_back">
          <span>Go Back</span>
        </button>

        <!-- </iframe> -->
        <div id="render-content" style="display: flex; width: 80%;"></div>
      </article>
